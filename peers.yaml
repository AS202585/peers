AS15169:
    description: Google
    import: AS15169:RADB::AS-GOOGLE  
    export: AS202585:AS-RODEO
    not_on:
      - amsix
    # Frys-IX: Google only peers with us over IPv6 there (they dial from both
    # ports on v6 only), so skip their two IPv4 addresses.
    not_with:
      - 185.1.160.180
      - 185.1.160.220
    # Google's RADB as-set covers only ~17 v6 prefixes of the ~300 they announce;
    # the rest is accepted on ROA - since 2026-09-17 that is the default for every
    # peer (kees2 filter.j2); use `accept_roa_valid: false` to opt a peer out.

AS8075:
    description: Microsoft
    import: AS-MICROSOFT
    export: AS202585:AS-RODEO
    # Peering request sent 2026-09-17 (peering@microsoft.com); bilateral at AMS-IX only.

AS203291:
    description: Frys-IX L3 Services
    import:  AS203291:AS-MEMBERS
    export: AS202585:AS-RODEO
    # NOT a peer cone but a near-full-table L3 feed (127k v4 / 62k v6 ROA-valid
    # prefixes). It is at ENS-IX at local_pref 310, above every Amsterdam IX, so
    # ROA acceptance made it the best path for ~230k prefixes and hairpinned that
    # traffic AMS -> vlan1337 -> ENS-IX (seen 2026-09-17). IRR-only until the
    # ENS-IX preference is reconsidered.
    accept_roa_valid: false

